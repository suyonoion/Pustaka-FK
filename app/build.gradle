plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.fk.arsip'
    compileSdk 34

    defaultConfig {
        applicationId "com.fk.arsip"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0-Solid"
    }
    
    buildFeatures {
        dataBinding true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Mesin Sabuk Geser Buku
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    
    // Mesin Penggiling Database Lokal (SQLite/Room)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // PAGING 3 (mode buku/ViewPager2): paging-runtime menyediakan Pager/
    // PagingSource/PagingDataAdapter, room-paging WAJIB ada agar Room (kapt)
    // bisa meng-generate implementasi untuk fungsi DAO yang return
    // PagingSource<Int, Entity> -- versinya harus sinkron dengan room_version
    // di atas, kalau tidak kapt akan gagal dengan error "NonExistentClass".
    implementation "androidx.paging:paging-runtime-ktx:3.2.1"
    implementation "androidx.room:room-paging:$room_version"
    
    // Proyektor Gambar
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Pipa Transmisi Firebase (BOM mengontrol keselarasan versi secara otomatis)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    
    // Sensor Pelacak Kerusakan & Analisis Arus
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation "androidx.work:work-runtime-ktx:2.9.0" // Pastikan menggunakan versi stabil terbaru
implementation 'androidx.gridlayout:gridlayout:1.0.0'
}
